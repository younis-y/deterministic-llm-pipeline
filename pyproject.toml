[project]
name = "rolescan"
version = "2.5.8"
description = "Typed, async, plugin-based job scanner with LLM fit scoring and CV variant matching"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.28",
    "pydantic>=2.11",
    "pyyaml>=6.0",
    "typer>=0.15",
    "rich>=13.9",
    "aiosqlite>=0.20",
    "extruct>=0.17",
]

[project.optional-dependencies]
# The Claude backend is optional: rolescan runs on keyword scoring, or on a
# local model via Ollama, with no extra install and no credentials.
anthropic = ["anthropic>=1.0"]
dev = [
    "anthropic>=1.0",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "respx>=0.22",
    "ruff>=0.9",
    "mypy>=1.14",
    "types-PyYAML",
]

[project.scripts]
rolescan = "rolescan.cli:app"

# Third-party packages can ship extra sources by advertising this group.
# rolescan discovers and registers them at import time; no core changes needed.
[project.entry-points."rolescan.judges"]
anthropic = "rolescan.scoring.judges:AnthropicJudge"
ollama = "rolescan.scoring.judges:OllamaJudge"

[project.entry-points."rolescan.sources"]
smartrecruiters = "rolescan.sources.ats:SmartRecruiters"
greenhouse = "rolescan.sources.ats:Greenhouse"
lever = "rolescan.sources.ats:Lever"
ashby = "rolescan.sources.ats:Ashby"
workable = "rolescan.sources.ats:Workable"
workday = "rolescan.sources.workday:Workday"
structured = "rolescan.sources.structured:Structured"
adzuna = "rolescan.sources.adzuna:Adzuna"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rolescan"]

# ---------------------------------------------------------------------------
# Ruff: lint + format, replacing flake8, black, isort, pyupgrade
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",    # pycodestyle + pyflakes
    "I",              # isort
    "N",              # pep8-naming
    "UP",             # pyupgrade
    "B",              # bugbear
    "C4",             # comprehensions
    "SIM",            # simplify
    "ASYNC",          # async correctness
    "RUF",            # ruff-specific
    "ANN",            # missing annotations
    "PTH",            # prefer pathlib
    "RET",            # return simplification
    "TID",            # tidy imports
    "C90",            # mccabe complexity — the gate that stops run_scan recurring
    "PERF",           # perflint: inefficient loop patterns
    "FURB",           # refurb: modernisations that usually shorten code
    "DTZ",            # naive datetimes (found a real bug in Job._parse_date)
    "ARG",            # unused arguments
    "PIE",            # misc simplifications
    "ERA",            # commented-out code
    "EM",             # exception message hygiene
    "RSE",            # raise ... from
]

# Deliberately NOT selected. Recorded so nobody re-adds them without thinking.
#
#   S  (bandit)     477 of its 575 findings are S101 "assert used", in the test
#                   suite, which is what tests are for. The two findings worth
#                   having are handled at the site: see the `# noqa: S608` in
#                   store.py. Turning the rule on to silence 477 of them with a
#                   per-file ignore buys nothing this does not already have.
#   PL (pylint)     PLC0415 flags 17 import-outside-top-level, every one of them
#                   a deliberate lazy import of an optional SDK (anthropic) or a
#                   cycle break — the mechanism that makes those dependencies
#                   optional. PLR2004 magic-value-comparison fires 31 times,
#                   mostly on HTTP status codes and test fixtures.
#   D  (pydocstyle) This codebase documents deliberately and at length, in
#                   sentences rather than to a template. A docstring linter
#                   would generate churn, not clarity.
ignore = [
    "ANN401",  # allow Any in narrow spots
    "B008",    # typer uses function calls in defaults by design
]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.per-file-ignores]
# ARG: pytest fixtures are legitimately requested and not referenced.
# C90: a long, linear, branch-free test is not complex in the sense that
# matters; splitting one to satisfy the gate makes it harder to read.
# EM: a test double raising `OSError("connection refused")` is clearest read
# exactly like that, and no reader ever sees the traceback.
"tests/*" = ["ANN", "E501", "ARG", "C90", "EM"]

[tool.ruff.lint.isort]
known-first-party = ["rolescan"]

# ---------------------------------------------------------------------------
# mypy: strict. ty is the emerging Astral checker but is still preview in 2026,
# so CI runs mypy.
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
disallow_any_generics = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
# Models deliberately accept lenient input and normalise it in before-validators
# (a Lever epoch-millis timestamp becoming a date, for instance), so a typed
# __init__ would reject calls the model handles correctly by design.
init_typed = false
# SourceEntry uses extra="allow" for per-source keys such as Workday's site.
init_forbid_extra = false
warn_required_dynamic_aliases = true

[[tool.mypy.overrides]]
module = ["extruct.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["respx.*", "aiosqlite.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# deptry: unused, missing and transitive dependencies. Run with `uvx deptry .`.
# ---------------------------------------------------------------------------
[tool.deptry]
# src-layout: `rolescan` is this project, not a PyPI package it forgot to
# declare. Without this every intra-package import reads as DEP001.
known_first_party = ["rolescan"]

[tool.deptry.package_module_name_map]
pyyaml = ["yaml"]
types-PyYAML = ["yaml"]

[tool.deptry.per_rule_ignores]
# Dev tooling is invoked as a command, never imported, so "unused" is what it
# should look like. anthropic is imported lazily inside the judge, which is
# the mechanism that makes the SDK optional.
DEP002 = ["pytest", "pytest-asyncio", "respx", "ruff", "mypy", "types-PyYAML"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--strict-markers"
