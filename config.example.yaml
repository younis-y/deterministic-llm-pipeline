# rolescan configuration. Copy to config.yaml and edit.
#
# NOTHING HERE REQUIRES A CREDENTIAL. Every source except Adzuna, Reed and
# Jooble is a public endpoint, and keyword scoring is pure Python. Keys are
# optional upgrades:
#   ANTHROPIC_API_KEY   LLM fit scoring  (or use a local model)
#   ADZUNA_APP_ID/KEY   an extra aggregator source
#   REED_API_KEY        Reed.co.uk, the UK
#   JOOBLE_API_KEY      Jooble, 60-odd countries
#   ROLESCAN_SMTP_PASS   emailing the digest instead of printing it
# Secrets are read from the environment, so this file stays safe to commit.
#
# Relative paths resolve against THIS FILE, not the working directory, so a
# cron job writes to the same database as an interactive run.
#
# Every key, with its type, default and meaning, is in docs/config.md. For the
# smallest working file, see examples/quickstart.yaml.

profile:
  name: Your Name

  # Handed to the LLM verbatim as your background. The more precise, the better
  # the fit scores. Numbers beat adjectives. Say how senior you actually are —
  # it stops the scorer flattering you into roles you will not get.
  summary: |
    Your degree, graduation date, and class. Your roles, with what you built
    and what changed because of it. Projects, with the numbers in them. Tools
    and domains you know. Languages. Where you can legally work. Roughly how
    many years of real experience you have.

  # Substring-matched against each posting's location, case-insensitively.
  # A posting with no stated location is NOT penalised.
  locations:
    - london
    - united kingdom
  allow_remote: true

  # Stage-one prefilter weights. Tripled when the term appears in the title.
  # This is the single biggest lever on cost: postings scoring below
  # min_keyword_score never reach the LLM.
  #
  # Each keyword is a plain, case-insensitive SUBSTRING match, not a whole
  # word: `ai` also matches "maintain" and "email". Write `machine learning`
  # or `ai engineer`, not `ai`. (Blockers below are whole-word matches.)
  keywords:
    python: 5
    data scientist: 7
    machine learning: 5
    analyst: 3
    graduate: 4

  # Subtracted from the keyword score, and always shown when they hit. This is
  # a severity gradient: a weight says how much a term costs you, and nothing
  # more. However heavy, a term here is still only a preference - the LLM can
  # still say apply, as long as what is left clears min_keyword_score below.
  #
  # Matched exactly as hard_blockers are: normalised at load, case-insensitive,
  # on word boundaries. `director` does not hit "directorate", `head of` does
  # not hit "head office". A deduction that crosses min_keyword_score deletes
  # the posting as surely as a hard bar does, so loose matching here was never
  # the cheap mistake it looked like.
  blockers:
    security clearance: 60
    "10+ years": 20
    director: 15
    unpaid: 30
  location_penalty: 25

  # Places you cannot or will not work. Whole-word match against the posting's
  # location field only; a match blocks the posting like a hard_blockers term.
  # excluded_locations: [united states]

  # Recruiters and staffing firms (matched on the COMPANY name only) and what
  # their listings cost. 0 disables the penalty; a penalty and not a bar, so an
  # agency-only role still appears, below the employer's own posting.
  # agencies: [Example Recruitment]
  # agency_penalty: 15

  # Drop postings older than this many days from aggregator sources. Employer
  # boards are exempt, as is a posting with no date. 0 turns it off.
  # max_age_days: 90

  # `blockers` terms whose weight counts only when the term is in the job
  # TITLE. For words that name a level or sector in a title but turn up as
  # boilerplate in bodies: "head office", "board of directors", an equal-
  # opportunity line about "military or veteran status". A term here keeps its
  # weight from `blockers`; one also in `hard_blockers` still bars on the whole
  # text. Default empty: every blocker counts anywhere.
  # title_only_blockers: [head of, director, military]

  # Structural bars: things no application can get past. A term here forces a
  # `blocked` verdict that no LLM opinion can override, so a posting matching
  # one is removed from the digest and never shown again - with
  # output.show_blocked false it is deleted outright. Reserve it for facts
  # about you that will not change: a clearance you do not hold, a
  # nationality gate, a visa you cannot get.
  #
  # Hardness is deliberately NOT a weight threshold. A weight and a wall
  # change on completely different timescales, and one number cannot honestly
  # encode both: a term here keeps whatever weight `blockers` gives it, and
  # costs nothing at all if `blockers` does not mention it.
  #
  # Matched on word boundaries, case-insensitively, so `crypto` does not hit
  # "cryptographic". Keep the list short and specific: everything on it can
  # delete a real role you would otherwise have read.
  hard_blockers:
    - security clearance

  # Nationalities you hold, as an advert would word them: the demonym and the
  # country. A nationality bar whose quote names one of them is not a bar for
  # you. A residence permit is not a nationality, so do not list one. If a
  # matching term is also in hard_blockers, remove it from there. Default none.
  # nationalities: []

  min_keyword_score: 18   # below this, a posting never reaches the LLM
  min_report_score: 55    # below this, a posting never reaches the digest.
                          # Suits model scores; a keyword-only run (--no-llm)
                          # scores lower, so use about 20 to 30 there.

  # How far under min_keyword_score a posting may fall and still be listed in
  # the digest's "Hidden by your rules" section, so a weight that is rejecting
  # good roles shows up. 0 lists none.
  # hidden_gate_margin: 10

  # Eligibility rules, applied by code in facts mode (llm.mode: facts) to the
  # facts the model quotes from each posting. The model never decides these;
  # it only extracts them, each with a verbatim quote that is checked against
  # the posting before it may count.
  #
  # The not-stated rule: a fact the posting does not state never fires a
  # rule. A posting that gives no level, no years and no student restriction
  # is decided on fit alone. Every skip a rule makes names the rule and quotes
  # the advert, e.g. Skip: advert asks for "5+ years".
  #
  # Omit the whole block and no rule fires (structural hard bars still do).
  # rules:
  #   max_years_required: 2      # skip a stated minimum above this. Default
  #                              # null: no years check.
  #   allowed_levels:            # default: graduate_entry, junior, mid,
  #     - graduate_entry         # not_stated. Others: senior, lead_principal.
  #     - junior                 # Keep not_stated, or every advert that does
  #     - not_stated             # not state a level is skipped.
  #   student_only: skip         # skip roles open only to current students.
  #                              # Default allow.
  #   max_graduation_year: 2027  # skip a stated graduation year above this
  #                              # (the earliest the advert accepts). While
  #                              # set, student_only applies only to adverts
  #                              # that state no year. Default null: no limit.
  #   level_from_title_only: true  # only a level word in the job title can
  #                              # skip; a level the model states is
  #                              # ignored. Default false.
  #   allowed_fields:            # default null: any field. Values:
  #     - data_engineering       # data_engineering, ai_llm, data_science,
  #     - ai_llm                 # analytics_bi, quant, product, software,
  #     - data_science           # consulting, finance, other.
  #   field_exempt_companies: [] # employers whose postings pass the field
  #                              # rule whatever their field (company name,
  #                              # case-insensitive, whole words). Default none.

llm:
  # Set false to score on keywords alone — no key, no network, no bill.
  enabled: true

  # Which backend judges postings. `rolescan backends` lists them.
  #   anthropic  Claude API. Best quality. Needs ANTHROPIC_API_KEY.
  #              With no key it disables itself and you get keyword scores,
  #              and the digest says so rather than pretending.
  #   ollama     A local model. Free, offline, no key. Set model to something
  #              you have pulled, e.g. qwen2.5:7b or llama3.1:8b. The README's
  #              "Measured quality" says what has and has not been measured.
  #              hard_blockers below do not depend on the model, so keep the
  #              structural bars there rather than trusting it to spot them.
  backend: anthropic
  model: claude-sonnet-5

  # How the model is used.
  #   facts  (default) The model extracts quoted facts - level, years,
  #          student-only, field, hard bars - plus a skills/domain fit score.
  #          Code then applies profile.rules. A level word in the title
  #          (senior, lead, graduate, intern...) decides the level outright.
  #          Only nationality and clearance bars block; any other stated
  #          requirement is a skip with its quote, and a work-authorisation
  #          bar is ignored (put visa wording in hard_blockers).
  #   judge  One call per posting: the model gives the score, verdict and
  #          blockers itself. A supported mode. profile.rules do not apply,
  #          and llm.extra_prompt is used. See the README, "Judge mode".
  # mode: facts

  # Name of a registered enricher (entry-point group `rolescan.enrichers`)
  # that does extra work only for postings that clear min_report_score, e.g.
  # adding your own advice. Empty means none. A failing enricher keeps the
  # plain verdict.
  # enricher: ""

  # A YAML list of worked examples (title, company, description, facts in the
  # shape the model returns) appended to the facts-mode system prompt, inside
  # the cached prefix. Relative to this file; validated at load. Default none.
  # facts_examples_file: facts_examples.yaml

  # Appended verbatim to the judge-mode system prompt. In facts mode it is NOT
  # sent to the scoring call (only an enricher may use it), and rolescan logs
  # a note at startup if it is set with no enricher to receive it.
  # extra_prompt: ""

  # api_key: ""            # leave blank: read from ANTHROPIC_API_KEY
  # max_tokens: 1500       # the longest answer asked of the model
  # cascade: true          # two passes where the backend's short call is cheaper
  # temperature: 0.0       # 0 suits classification against a fixed rubric

  # base_url: http://localhost:11434   # ollama only
  # timeout: 120.0                     # local models are slow; per posting

  max_concurrent: 5
  max_calls_per_run: 60      # hard spend ceiling
  # Wall-clock budget for the model in one scan, in minutes, counted from its
  # first call. A call count says little about time on a local model, where
  # one call takes 10 to 40 seconds. When it is spent no new call starts and
  # the postings not yet scored are deferred to the next run. 0 = no limit.
  # max_minutes: 0
  description_chars: 6000
  cache_days: 30             # verdicts are cached on description text; 0 = never expire

  # Ollama only. The context window, in tokens, asked of the model on every
  # call; unset, rolescan sends 12288. (A call with no num_ctx lets Ollama size
  # the window from the machine's memory, and a small one silently cuts the
  # middle out of the prompt.) rolescan checks before the scan that the model
  # can hold this many; a model whose own window is smaller (8k) is refused:
  # no posting is sent to it, the run falls back to keyword scoring, and
  # `rolescan scan` exits 3.
  # num_ctx: 12288
  # An answer whose token counts show the prompt was cut is an error, not
  # facts. Set false only if your Ollama counts just the uncached part of a
  # prompt, so every call would look cut.
  # check_truncation: true

http:
  timeout: 20.0
  max_concurrent: 8
  max_retries: 3
  # user_agent: ""         # replaces the whole header when set
  # Every request says "rolescan/<version> (+<contact_url>)", so a site owner
  # can see what is calling. Point it at your fork or a page of your own.
  # contact_url: https://example.org/about-my-job-scanner

output:
  dir: digests
  db_path: seen.db
  max_roles: 15
  show_blocked: true         # blocked roles are worth seeing once
  thin_unread_after: 3       # runs a posting may lack text before it is listed as unread
  # Most lines in the digest's "Hidden by your rules" section (highest scores
  # first, counted across every rule). The rest go to a -hidden.md file beside
  # the digest, which names it. 0 lists none.
  # hidden_max: 60
  # Daily copies of the store kept in backups/ beside it, taken before a scan
  # opens it. 0 turns the automatic copy off; `rolescan backup` still copies
  # on demand and never deletes.
  # backup_keep: 7
  # How many days each cache keeps a row; 0 keeps a table whole. Never touches
  # `seen` or `applications`. A scan trims after it records; so does
  # `rolescan prune`. `verdicts` is never less than llm.cache_days.
  # retention_days:
  #   postings: 90
  #   deferred: 45
  #   verdicts: 180
  email:
    enabled: false
    smtp_host: smtp.example.com
    # 587 (the default) connects in plain text and upgrades with STARTTLS;
    # 465 uses implicit TLS, encrypted from the first byte. Either way the
    # server's certificate must verify: a self-signed relay is refused.
    smtp_port: 587
    username: you@example.com
    to: you@example.com
    # Leave unset unless the mail never arrives. On a machine where a VPN blocks
    # the mail ports (465, 587, 993) while HTTPS passes, the send times out and
    # the digest stays on disk. Name the interface that reaches the internet
    # directly (`en0` on a Mac's Wi-Fi, `eth0` or `wlan0` on Linux) and the mail
    # socket binds to its IPv4 address, looked up at every send.
    # bind_interface: en0

# ---------------------------------------------------------------------------
# Sources. Run `rolescan sources` for every registered kind and its slug format.
#
# Finding real slugs is the hard part. Two ways:
#   rolescan slugs "Octopus Energy"   search a harvested ATS dataset
#   rolescan discover                 probe what you have configured
#
# `verified: true` is a note to yourself that discover confirmed it. See
# examples/energy-trading.yaml for a fully resolved, working list.
# ---------------------------------------------------------------------------
sources:
  # Keyless ATS APIs — the slug is the last path segment of the careers URL.
  - {kind: greenhouse, slug: example, label: Example Co}
  # Any entry takes `enabled: false` to stay in the file and be skipped, and
  # `verified: true` as a note to yourself that discover confirmed it.
  # - {kind: lever, slug: example, label: Example Co}
  # - {kind: ashby, slug: example, label: Example Co}
  # - {kind: workable, slug: example, label: Example Co}
  # - {kind: smartrecruiters, slug: Example, label: Example Co}   # case sensitive

  # Workday needs three coordinates, all from the careers URL:
  #   https://<slug>.<host>.myworkdayjobs.com/en-US/<site>
  # From discover: 422 means no such tenant (slug or host wrong); 404 means the
  # tenant exists and the site value is wrong.
  # - {kind: workday, slug: example, site: Example_Careers, host: wd3, label: Example Co}
  # A board holding more than 500 postings is read to 500 and listed under
  # "Sources that were cut short". Lift the cap with max_rows: 2000, or narrow
  # the read with Workday's own facets (applied_facets: {<facet parameter>:
  # [<value id>]}, ids from the board's listing answer) or with one pass per
  # search (search_text: [data, analyst]).

  # The generic source: any careers site that publishes schema.org JobPosting
  # and a sitemap. Covers Phenom People, SAP SuccessFactors, Teamtailor and
  # Harbour with no adapter of their own. Add employers here by config alone.
  #   exclude_pattern is optional — drop URLs before they are fetched, e.g. to
  #   skip a region on a board that mixes several.
  # - {kind: structured, slug: example, label: Example Co,
  #    sitemap: "https://careers.example.com/sitemap.xml",
  #    url_pattern: "/job/", delay: 0.4}
  # A `Crawl-delay` in the site's robots.txt raises `delay` to that. For a
  # sitemap of thousands of URLs (a job board's latest-jobs sitemap) add
  # `max_age_days: 14` (skip a URL whose lastmod is older) and `incremental:
  # true` (after the first scan, read only what changed since the last one).
  # A sitemap listing more than `max_sitemap_urls` (50000) is refused.

  # An aggregator that needs credentials. Covers 20 countries; the Gulf is not
  # among them. Free tier at developer.adzuna.com.
  # - kind: adzuna
  #   slug: gb
  #   max_days_old: 7
  #   queries: [data scientist, machine learning engineer]
  #   max_pages: 5          # pages read per query; a longer result list is
  #                         # reported as cut short (results_per_page: 1 to 50)

  # Reed (the UK) and Jooble (60-odd countries): two more aggregators, each
  # with a key from the provider. With no key the source is skipped, and the
  # digest says so. `slug` is only a label. Built from the providers' public
  # documentation, not yet run against the live services.
  # - kind: reed
  #   slug: uk
  #   queries: [data scientist, energy analyst]
  #   where: London                 # optional
  #   graduate: true                # optional: graduate roles only
  #   direct_employer_only: true    # optional: no recruitment agencies
  # - kind: jooble
  #   slug: gb
  #   queries: [data scientist, energy analyst]
  #   where: London                 # optional

  # Workable's own search across the employers that post on it: no key, and
  # `slug` is only a label. Workable's dates are when the advert went up, so
  # `profile.max_age_days` applies.
  # - kind: workable_search
  #   slug: gb
  #   queries: [data scientist, energy analyst]
  #   where: London                 # optional
  #   delay: 2                      # optional: seconds between requests (default 2)
